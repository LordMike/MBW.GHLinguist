name: Publish NuGet

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Validate and normalize tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TAG_PROTECTED: ${{ github.ref_protected }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
            throw "Release tag '$env:RELEASE_TAG' must look like v1.2, v3.4.5, or v4.6-alpha."
          }
          if ($env:RELEASE_TAG_PROTECTED -ne 'true') {
            throw "Release tag '$env:RELEASE_TAG' must match a protected tag rule before it can publish."
          }

          $versionParts = $Matches.version -split '-', 2
          $coreVersion = $versionParts[0]
          if (($coreVersion -split '\.').Count -eq 2) {
            $coreVersion += '.0'
          }

          $packageVersion = if ($versionParts.Count -eq 2) {
            "$coreVersion-$($versionParts[1])"
          }
          else {
            $coreVersion
          }

          "package-version=$packageVersion" >> $env:GITHUB_OUTPUT
          "NuGet package version: ``$packageVersion``" >> $env:GITHUB_STEP_SUMMARY

  test:
    needs: version
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MBW.GHLinguist.slnx --nologo
      - name: Build
        run: dotnet build MBW.GHLinguist.slnx --configuration Release --no-restore --nologo
      - name: Test
        run: dotnet test --solution MBW.GHLinguist.slnx --configuration Release --no-build --minimum-expected-tests 1

  linux-native:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Build Linguist
        shell: pwsh
        run: ./eng/linguist/build-docker.ps1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-linux-x64
          path: .tmp/artifacts/linguist/linux-x64/lib/linguist/linguist.so
          if-no-files-found: error

  windows-native:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
      - name: Build Linguist
        shell: pwsh
        run: ./eng/linguist/build-windows.ps1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-win-x64
          path: .tmp/artifacts/linguist/win-x64/lib/linguist/linguist.so
          if-no-files-found: error

  package:
    needs:
      - version
      - test
      - linux-native
      - windows-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-linux-x64
          path: .tmp/artifacts/native/linux-x64
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-win-x64
          path: .tmp/artifacts/native/win-x64
      - name: Pack
        run: >-
          dotnet pack src/MBW.GHLinguist/MBW.GHLinguist.csproj
          --configuration Release
          --output .tmp/packages
          --nologo
          -p:PackageVersion=${{ needs.version.outputs.package-version }}
          -p:ValidateRidAssets=true
      - name: Verify package
        shell: pwsh
        run: >-
          ./eng/nuget/verify-package.ps1
          -Package '.tmp/packages/*.nupkg'
          -ExpectedVersion '${{ needs.version.outputs.package-version }}'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: MBW.GHLinguist-${{ needs.version.outputs.package-version }}
          path: .tmp/packages/*.nupkg
          if-no-files-found: error

  publish:
    needs:
      - version
      - package
    runs-on: ubuntu-24.04
    environment: nuget.org
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: MBW.GHLinguist-${{ needs.version.outputs.package-version }}
          path: .tmp/packages
      - name: Validate NuGet.org credentials
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The NUGET_API_KEY repository secret is not configured.'
          }
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push ".tmp/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
