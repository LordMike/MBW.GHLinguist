name: Deploy

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      version:
        required: true
        type: string
      is-prerelease:
        required: true
        type: string

jobs:
  github_release:
    name: Publish verified package release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          name: package-artifacts
          path: .artifacts

      - name: Validate release context and stage attachments
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.is-prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = $env:RELEASE_TAG -replace '^v'
          if ($env:RELEASE_VERSION -cne $expectedVersion) {
            throw "Release tag $env:RELEASE_TAG does not match package version $env:RELEASE_VERSION."
          }
          if ($env:IS_PRERELEASE -notin 'true', 'false') {
            throw "Invalid prerelease flag: $env:IS_PRERELEASE"
          }
          if (($env:RELEASE_VERSION.Contains('-')) -ne ($env:IS_PRERELEASE -eq 'true')) {
            throw 'The prerelease flag does not match the package version.'
          }

          $packages = @(Get-ChildItem .artifacts/nuget -Filter '*.nupkg' -File | Where-Object Name -NotLike '*.snupkg')
          $symbols = @(Get-ChildItem .artifacts/nuget -Filter '*.snupkg' -File)
          if ($packages.Count -ne 3) { throw "Expected exactly three primary packages, found $($packages.Count)." }
          if ($symbols.Count -ne 1) { throw "Expected exactly one symbol package, found $($symbols.Count)." }

          $expectedPackages = @{
            'MBW.GHLinguist' = @{ Kind = 'managed'; RuntimeIdentifier = $null }
            'MBW.GHLinguist.Runtime.win-x64' = @{ Kind = 'runtime'; RuntimeIdentifier = 'win-x64' }
            'MBW.GHLinguist.Runtime.linux-x64' = @{ Kind = 'runtime'; RuntimeIdentifier = 'linux-x64' }
          }
          foreach ($package in $packages) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $nuspec = @($archive.Entries | Where-Object FullName -Like '*.nuspec')
              if ($nuspec.Count -ne 1) { throw "Expected exactly one nuspec in $($package.Name)." }
              $reader = [IO.StreamReader]::new($nuspec[0].Open())
              try { [xml] $document = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $id = $document.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='id']").InnerText
              if (-not $expectedPackages.ContainsKey($id)) { throw "Unexpected package identity '$id'." }
              $kind = $expectedPackages[$id]
              if ($null -eq $kind.RuntimeIdentifier) {
                ./eng/nuget/verify-package.ps1 -Package $package.FullName -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -Kind $kind.Kind
              }
              else {
                ./eng/nuget/verify-package.ps1 -Package $package.FullName -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA -Kind $kind.Kind -RuntimeIdentifier $kind.RuntimeIdentifier
              }
              $expectedPackages.Remove($id)
            }
            finally { $archive.Dispose() }
          }
          if ($expectedPackages.Count -ne 0) { throw "Missing expected package identities: $($expectedPackages.Keys -join ', ')." }

          $metadata = Get-Content .artifacts/ci-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.sha -cne $env:GITHUB_SHA -or $metadata.version -cne $env:RELEASE_VERSION) {
            throw 'CI metadata does not identify the checked-out release source and version.'
          }
          New-Item -ItemType Directory -Path .artifacts/release -Force | Out-Null
          Copy-Item $packages.FullName, $symbols.FullName, .artifacts/ci-metadata.json -Destination .artifacts/release
          Get-ChildItem .artifacts/release -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content .artifacts/release/SHA256SUMS -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: ./.github/actions/publish_github_release
        with:
          release-tag: ${{ inputs.release-tag }}
          is-prerelease: ${{ inputs.is-prerelease }}
        env:
          GITHUB_RELEASE_TOKEN: ${{ github.token }}
