name: Deploy

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      version:
        required: true
        type: string
      is-prerelease:
        required: true
        type: string
      is-plain-version:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: No deployment configured
        run: echo "No repository-specific deployment is configured for ${{ inputs.release-tag }}."
