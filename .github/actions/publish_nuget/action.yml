# This file is centrally managed; local edits may be lost.

name: Publish NuGet packages
description: Publish collected NuGet packages to the registries selected by CI

# Contract:
# - Packages are read only from .artifacts/nuget.
# - GitHub Packages is the default publishing destination for trusted push refs.
# - NuGet.org is an explicit opt-in controlled by the calling job.
# - Registry credentials are supplied only by the invoking publishing job.

inputs:
  publish-target:
    description: Publication destination (github or nuget-org)
    required: true
  publish-nuget-org:
    description: Whether this invocation is explicitly authorized to publish to NuGet.org
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: 10.0.400

    - name: Publish NuGet packages to GitHub Packages
      if: inputs.publish-target == 'github'
      shell: bash
      env:
        PACKAGE_TOKEN: ${{ env.NUGET_GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        mapfile -t packages < <(find .artifacts/nuget -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' -print | sort)
        for package in "${packages[@]}"; do
          dotnet nuget push "$package" \
            --no-symbols \
            --skip-duplicate \
            --api-key "$PACKAGE_TOKEN" \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
        done

    - name: Publish packages to NuGet.org
      if: inputs.publish-nuget-org == 'true' && inputs.publish-target == 'nuget-org'
      shell: bash
      env:
        NUGET_KEY: ${{ env.NUGET_ORG_KEY }}
      run: |
        set -euo pipefail
        if [ -z "$NUGET_KEY" ]; then
          echo '::error::NUGET_KEY is required for tagged package publication.'
          exit 1
        fi

        mapfile -t packages < <(find .artifacts/nuget -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' -print | sort)
        for package in "${packages[@]}"; do
          dotnet nuget push "$package" \
            --skip-duplicate \
            --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json
        done
